[program:tbs-worker]
command=php /var/www/tbscontainermnl/artisan queue:work --sleep=3 --tries=3 --timeout=0
process_name=%(program_name)s_%(process_num)02d
numprocs=4
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/tbscontainermnl/storage/logs/worker.log
stopwaitsecs=3600
